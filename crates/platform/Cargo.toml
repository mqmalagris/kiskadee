[package]
name = "kiskadee-platform"
description = "kiskadee OS integration: keychain, user presence, IPC transport and service install."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
dirs = "6"
interprocess = "2.4"
keyring-core = "1"

[lints]
workspace = true

[target."cfg(windows)".dependencies]
widestring = "1"
windows = { version = "0.62", features = ["Foundation", "Security_Credentials", "Security_Credentials_UI", "Security_Cryptography", "Storage_Streams", "Win32_System_Console", "Win32_System_WinRT", "Win32_Foundation"] }
windows-native-keyring-store = "1.1.0"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }

[target."cfg(windows)".dev-dependencies]
windows-future = "0.3"

[dev-dependencies]
chacha20poly1305 = "0.10"
rand = "0.9"
sha2 = "0.10"
