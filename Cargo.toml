[workspace]
resolver = "3"
members = ["crates/core", "crates/mail", "crates/platform", "crates/kiskadee"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98"

[workspace.dependencies]
kiskadee-core = { path = "crates/core" }
kiskadee-mail = { path = "crates/mail" }
kiskadee-platform = { path = "crates/platform" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Enforces the UntrustedText barrier configured in clippy.toml.
disallowed_methods = "deny"
disallowed_macros = "deny"
